<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e1b6b"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <path d="M60 8h136a52 52 0 0 1 52 52v8C190 40 66 40 8 68v-8A52 52 0 0 1 60 8z" fill="#ffffff" opacity="0.08"/>

  <!-- database: three stacked platters -->
  <g transform="translate(0 -6)">
    <!-- bottom platter -->
    <path d="M44 156v28c0 15 34 27 76 27s76-12 76-27v-28c0 15-34 27-76 27s-76-12-76-27z" fill="url(#disc)"/>
    <!-- middle platter -->
    <path d="M44 110v28c0 15 34 27 76 27s76-12 76-27v-28c0 15-34 27-76 27s-76-12-76-27z" fill="url(#disc)"/>
    <!-- top platter body -->
    <path d="M44 64v28c0 15 34 27 76 27s76-12 76-27V64z" fill="url(#disc)"/>
    <!-- top face -->
    <ellipse cx="120" cy="64" rx="76" ry="27" fill="#eff6ff"/>
    <ellipse cx="120" cy="64" rx="52" ry="15" fill="#93c5fd" opacity="0.55"/>
  </g>

  <!-- execute badge -->
  <circle cx="188" cy="186" r="46" fill="#1e1b6b"/>
  <circle cx="188" cy="186" r="38" fill="url(#badge)"/>
  <path d="M176 164l32 22-32 22z" fill="#1e1b6b" stroke="#1e1b6b" stroke-width="6" stroke-linejoin="round"/>
</svg>
