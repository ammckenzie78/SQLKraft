[package]
name = "sqlkraft"
version = "0.1.1"
edition = "2024"
description = "A SQL Server management studio for Linux (and everywhere else), written in Rust"
license = "MIT"
repository = "https://github.com/ammckenzie78/SQLKraft"
readme = "README.md"

# `cargo deb` packaging (https://github.com/kornelski/cargo-deb).
[package.metadata.deb]
maintainer = "Andy Mckenzie <56596888+ammckenzie78@users.noreply.github.com>"
copyright = "2026, Andy Mckenzie"
section = "database"
priority = "optional"
# $auto adds the shared libraries the binary links against (libc, libgcc, ...).
# eframe loads X11/Wayland/GL libraries at runtime with dlopen, so name them explicitly.
depends = "$auto, libxkbcommon0, libgl1, libx11-6 | libwayland-client0"
recommends = "xdg-desktop-portal"
extended-description = """\
A SQL Server management studio in the spirit of SSMS: Object Explorer, tabbed \
query windows with syntax highlighting, multiple result grids, a Messages tab, \
query cancel and CSV export. Native, single binary, no .NET or ODBC needed."""
assets = [
    ["target/release/sqlkraft", "usr/bin/", "755"],
    ["packaging/sqlkraft.desktop", "usr/share/applications/", "644"],
    ["packaging/sqlkraft.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/sqlkraft/README.md", "644"],
]

[features]
default = []
# Kerberos / integrated auth on Linux & macOS. Needs libgssapi (krb5) installed.
kerberos = ["tiberius/integrated-auth-gssapi"]

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
csv = "1.4.0"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
futures-util = "0.3.34"
rfd = "0.18.0"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
uuid = "1.29.3"

[build-dependencies]
# build.rs renders the app icon from packaging/sqlkraft.svg.
resvg = { version = "0.45", default-features = false }
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal", "sql-browser-tokio", "winauth"] }

[target.'cfg(unix)'.dependencies]
# sspi-rs gives NTLM "Windows authentication" (DOMAIN\user + password) on Linux without system libs.
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal", "sql-browser-tokio", "sspi-rs"] }

[profile.release]
lto = "thin"
strip = true
