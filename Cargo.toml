[package]
name = "sqlkraft"
version = "0.1.0"
edition = "2024"
description = "A SQL Server management studio for Linux (and everywhere else), written in Rust"
license = "MIT"

[features]
default = []
# Kerberos / integrated auth on Linux & macOS. Needs libgssapi (krb5) installed.
kerberos = ["tiberius/integrated-auth-gssapi"]

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
csv = "1.4.0"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
futures-util = "0.3.34"
rfd = "0.18.0"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
uuid = "1.29.3"

[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal", "sql-browser-tokio", "winauth"] }

[target.'cfg(unix)'.dependencies]
# sspi-rs gives NTLM "Windows authentication" (DOMAIN\user + password) on Linux without system libs.
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal", "sql-browser-tokio", "sspi-rs"] }

[profile.release]
lto = "thin"
strip = true
