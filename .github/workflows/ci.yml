name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on 22.04 so the binary runs on glibc 2.35+ (Ubuntu 22.04+, Debian 12+).
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Test
        run: cargo test --locked

      - name: Build .deb
        run: cargo deb --locked

      - name: Inspect and install the package
        run: |
          deb=$(ls target/debian/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo apt-get install -y "./$deb"
          sqlkraft --version
          if ldd /usr/bin/sqlkraft | grep "not found"; then exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: sqlkraft-deb-${{ matrix.arch }}
          path: target/debian/*.deb
          retention-days: 14

  live:
    name: Live tests (SQL Server ${{ matrix.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["2019", "2022"]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.version }}-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway container that lives only for this job.
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-Sa!
        ports:
          - 1433:1433
    env:
      SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-Sa!
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build tests
        run: cargo test --locked --no-run

      - name: Create the test login
        env:
          CONTAINER: ${{ job.services.mssql.id }}
        run: |
          # The test login gets only dbcreator, like a developer's local setup.
          TEST_PASSWORD="T$(openssl rand -hex 16)a!"
          echo "::add-mask::$TEST_PASSWORD"
          echo "SQLKRAFT_TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          sql() {
            docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" "$CONTAINER" bash -c '
              S=$(ls /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd 2>/dev/null | head -1)
              case "$S" in *tools18*) T=-C ;; *) T= ;; esac
              "$S" $T -S localhost -U sa -b -Q "$0"' "$1"
          }
          for i in $(seq 1 60); do
            if sql "SELECT 1" > /dev/null 2>&1; then break; fi
            sleep 2
          done
          sql "SELECT @@VERSION"
          sql "CREATE LOGIN sqlkraft_test WITH PASSWORD = N'$TEST_PASSWORD', CHECK_POLICY = OFF; ALTER SERVER ROLE dbcreator ADD MEMBER sqlkraft_test;"

      - name: Live tests
        env:
          SQLKRAFT_TEST_SERVER: localhost,1433
          SQLKRAFT_TEST_USER: sqlkraft_test
          SQLKRAFT_TEST_REQUIRED: "1"
        run: cargo test --locked -- --nocapture

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = "target/release/sqlkraft.exe"
          # A GUI-subsystem exe only runs synchronously when its output is piped.
          $v = & $exe --version | Out-String
          if ($v -notmatch '^sqlkraft \d') { throw "unexpected --version output: $v" }
          $v
          (Get-Item $exe).VersionInfo | Format-List FileDescription, ProductName, FileVersion

      - uses: actions/upload-artifact@v7
        with:
          name: sqlkraft-windows-x64
          path: target/release/sqlkraft.exe
          retention-days: 14

  macos:
    name: macOS arm64
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check the executable
        run: |
          v=$(target/release/sqlkraft --version)
          echo "$v"
          case "$v" in "sqlkraft "[0-9]*) ;; *) echo "::error::unexpected --version output: $v"; exit 1 ;; esac
          otool -L target/release/sqlkraft

      - name: Build SQLKraft.app
        run: |
          packaging/macos/build-app.sh
          plutil -p target/macos/SQLKraft.app/Contents/Info.plist
          file target/macos/SQLKraft.app/Contents/Resources/sqlkraft.icns

      - uses: actions/upload-artifact@v7
        with:
          name: sqlkraft-macos-arm64
          path: target/macos/SQLKraft-macos.zip
          retention-days: 14
