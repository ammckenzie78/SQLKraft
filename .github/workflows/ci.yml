name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on 22.04 so the binary runs on glibc 2.35+ (Ubuntu 22.04+, Debian 12+).
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Test
        run: cargo test --locked

      - name: Build .deb
        run: cargo deb --locked

      - name: Inspect and install the package
        run: |
          deb=$(ls target/debian/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo apt-get install -y "./$deb"
          sqlkraft --version
          if ldd /usr/bin/sqlkraft | grep "not found"; then exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: sqlkraft-deb-${{ matrix.arch }}
          path: target/debian/*.deb
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = "target/release/sqlkraft.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-Item $exe).VersionInfo | Format-List FileDescription, ProductName, FileVersion

      - uses: actions/upload-artifact@v7
        with:
          name: sqlkraft-windows-x64
          path: target/release/sqlkraft.exe
          retention-days: 14
